# SPDX-License-Identifier: AGPL-3.0-only
title = "bulkhead gitleaks config"

[extend]
useDefault = true

# gitleaks' default ruleset has no Tailscale rule, so detect them explicitly
# (auth keys are tskey-<type>-<keyID>-<secret>). Placeholders are allowlisted below.
[[rules]]
id = "tailscale-key"
description = "Tailscale auth/API key"
regex = '''tskey-(auth|api|client|webhook)-[A-Za-z0-9]{8,}-[A-Za-z0-9]{16,}'''
keywords = ["tskey-"]

[allowlist]
description = "global allowlist"
paths = [
  '''testdata/''',
  '''go\.sum$''',
  '''LICENSE$''',
]
# Documentation and examples use obvious placeholder secrets only; allow them
# so they do not trip the scanner. Real secrets never appear in the tree.
regexes = [
  '''EXAMPLE_[A-Z0-9_]+''',
  '''tskey-auth-(EXAMPLE|REDACTED|XXXX|x{4,})''',
  '''sk-ant-(EXAMPLE|REDACTED|x{4,})''',
]
