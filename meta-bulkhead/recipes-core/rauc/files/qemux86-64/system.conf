[system]
compatible=bulkhead appliance
bootloader=grub
grubenv=/grubenv/grubenv
data-directory=/data/
# Downgrade protection (RAUC update-path audit): refuse any bundle OLDER than this semver floor
# (rauc check_version_limits — install proceeds iff min-bundle-version <= manifest version; equal is
# allowed, so the current release still installs). Matches the bundle's RAUC_BUNDLE_VERSION baseline
# (DISTRO_VERSION). Raise this as old releases age out so a known-vulnerable signed bundle can't replay.
min-bundle-version=0.1.0

[keyring]
path=ca.cert.pem

[log.readable]
filename = rauc-history.log

[log.json]
filename = rauc-history.json
format=json

[slot.efi.0]
device=/dev/sda
type=boot-gpt-switch
region-start=4M
region-size=100M

[slot.rescue.0]
device=/dev/sda3
type=ext4
readonly=true

[slot.rootfs.0]
device=/dev/sda4
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/sda5
type=ext4
bootname=B
