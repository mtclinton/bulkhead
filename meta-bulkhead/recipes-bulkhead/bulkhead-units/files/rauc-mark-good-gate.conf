# Couple rauc-mark-good to the bulkhead SECURITY gates (RAUC update-path audit, HIGH).
#
# Upstream rauc-mark-good.service fires `rauc status mark-good` after boot-complete.target, which
# Requires ONLY sysinit.target (systemd-boot-check-no-failures is disabled by preset). So a slot that
# merely boots to sysinit gets its _TRY counter cleared to 0 and is PINNED — even if bulkhead-selftest
# or bulkhead-verify-audit FAILED. That defeats the A/B health-rollback the whole design depends on: a
# correctly-signed-but-malicious update, or any update that boots but trips the audit/selftest gate, is
# kept permanently instead of rolling back.
#
# Requiring + ordering after both gates makes mark-good run ONLY when the bulkhead security gates have
# PASSED. A gate failure leaves _TRY=1, so the next reboot falls back to the prior known-good slot. We
# couple to the SPECIFIC bulkhead gates (not the blunt systemd-boot-check-no-failures, which would also
# roll back on an unrelated optional-service failure like tailscale/llama).
[Unit]
After=bulkhead-selftest.service bulkhead-verify-audit.service
Requires=bulkhead-selftest.service bulkhead-verify-audit.service
