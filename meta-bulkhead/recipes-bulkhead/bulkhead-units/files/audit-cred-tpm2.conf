# Bare-metal tpm2 production override (ADR-0028, build-time, BULKHEAD_SEAL_KEY=tpm2). Installed
# as 20-audit-cred-tpm2.conf into the .d dir of EVERY audit-seed consumer (collector, broker,
# router, verify-audit), sorting after their base credential drop-in. Switches the seed delivery
# from the plaintext-on-/data VM path to the TPM2-sealed bare-metal path in ONE place per consumer:
#   - LoadCredential= (empty) RESETS the base unit's plaintext LoadCredential=audit-seed:.../audit-seed
#     (LoadCredential is a list directive; a drop-in must assign the empty string to clear it).
#   - LoadCredentialEncrypted unseals the TPM2-sealed cred the seal service produced (PCR 7, ADR-0008)
#     into $CREDENTIALS_DIRECTORY/audit-seed — the SAME path loadSigningKey/verify-audit already read,
#     so there is ZERO Go change. systemd refuses to start the unit if the cred won't decrypt
#     (fail-closed), reinforcing BULKHEAD_REQUIRE_SEALED_KEY=1.
# This file is identical for all four consumers (same .cred, same landing path). It is NOT installed
# in the default plain (VM/dev) build, so that path stays byte-for-byte unchanged.
[Service]
LoadCredential=
LoadCredentialEncrypted=audit-seed:/data/bulkhead/audit-seed.cred
