# Yocto-only drop-in (F5): fold audit-chain verification into the existing fail-closed boot
# gate. The selftest unit is what every protected service Requires=; making selftest itself
# Require= the chain verifier propagates a broken-chain failure to all of them WITHOUT
# editing each consumer. NOT in the shared rootfs-overlay (the Buildroot prototype has no
# /data/sealed seed and thus no bulkhead-verify-audit.service to depend on).
[Unit]
After=bulkhead-verify-audit.service
Requires=bulkhead-verify-audit.service
