# SPDX-License-Identifier: AGPL-3.0-only
# ADR-0034 increment 2 drop-in (sorts AFTER 10-data-persistence.conf): deliver the on-device
# re-signing CA to the egress proxy as systemd credentials — the SAME mechanism the audit seed uses,
# read from $CREDENTIALS_DIRECTORY — and turn on TLS-termination + content inspection for the
# inspect-marked allowlist entries. The CA key is plaintext-0600 on /data in this VM/dev phase (the
# audit-seed posture); LoadCredentialEncrypted + tpm2 sealing is the bare-metal sub-B arm.
[Unit]
Requires=bulkhead-provision-mitm-ca.service
After=bulkhead-provision-mitm-ca.service

[Service]
# The CA (public cert + private key) the proxy re-signs leaves with. With REQUIRE_MITM_CA=1 a
# missing/garbled CA fails the proxy CLOSED (it refuses to run), so an inspect-marked 443 flow is
# never spliced uninspected. The base data.conf already ReadWritePaths=/data for the chain.
LoadCredential=mitm-ca-key:/data/bulkhead/mitm-ca/ca.key
LoadCredential=mitm-ca-crt:/data/bulkhead/mitm-ca/ca.crt
Environment=BULKHEAD_REQUIRE_MITM_CA=1
# Ports treated as TLS for an inspect-marked destination. The qemu harness overrides this (and the
# upstream roots) via a /run drop-in to exercise a loopback mockchat on 8443 without internet.
Environment=BULKHEAD_EGRESS_TLS_PORTS=443
