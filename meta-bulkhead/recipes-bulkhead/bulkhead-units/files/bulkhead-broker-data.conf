# Yocto-only drop-in: on the read-only-rootfs appliance /var/lib is a volatile tmpfs, so
# the broker's signed approval-decision log (ADR-0007) would be wiped every reboot.
# Redirect it to the persistent /data partition (outside the RAUC A/B slots), mirroring
# the collector's audit persistence. NOT in the shared rootfs-overlay, so the Buildroot
# prototype keeps writing /var/lib/bulkhead/audit-broker unchanged.
[Unit]
RequiresMountsFor=/data

[Service]
ReadWritePaths=/data
ExecStartPre=/bin/mkdir -p /data/bulkhead/audit-broker
Environment=BULKHEAD_AUDIT_DIR=/data/bulkhead/audit-broker
