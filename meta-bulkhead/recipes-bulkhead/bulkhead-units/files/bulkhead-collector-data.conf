# Yocto-only drop-in: on the read-only-rootfs appliance, /var/lib is a volatile tmpfs
# (poky volatile-binds), so the collector's append-only audit log would be wiped every
# reboot. Redirect it to the persistent /data partition (/dev/sda6), which lives
# OUTSIDE the RAUC A/B rootfs slots and therefore also survives atomic updates.
# This is NOT in the shared rootfs-overlay, so the Buildroot prototype (writable
# rootfs) keeps writing /var/lib/bulkhead/audit unchanged.
[Unit]
RequiresMountsFor=/data

[Service]
# /data is a separate mount that exists once data.mount runs; ReadWritePaths=/data
# opens it under ProtectSystem=strict, and ExecStartPre can then create the subdir.
ReadWritePaths=/data
ExecStartPre=/bin/mkdir -p /data/bulkhead/audit
Environment=BULKHEAD_AUDIT_DIR=/data/bulkhead/audit
