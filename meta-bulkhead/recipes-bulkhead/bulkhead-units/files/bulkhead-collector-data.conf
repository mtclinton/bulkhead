# Yocto-only drop-in: on the read-only-rootfs appliance, /var/lib is a volatile tmpfs
# (poky volatile-binds), so the collector's append-only audit log would be wiped every
# reboot. Redirect it to the persistent /data partition (/dev/sda6), which lives
# OUTSIDE the RAUC A/B rootfs slots and therefore also survives atomic updates.
# This is NOT in the shared rootfs-overlay, so the Buildroot prototype (writable
# rootfs) keeps writing /var/lib/bulkhead/audit unchanged.
[Unit]
RequiresMountsFor=/data
# The TPM-sealed audit seed must be sealed before the collector unseals it (ADR-0008).
Requires=bulkhead-seal-audit-key.service
After=bulkhead-seal-audit-key.service

[Service]
# /data is a separate mount that exists once data.mount runs; ReadWritePaths=/data
# opens it under ProtectSystem=strict, and ExecStartPre can then create the subdir.
ReadWritePaths=/data
ExecStartPre=/bin/mkdir -p /data/bulkhead/audit
Environment=BULKHEAD_AUDIT_DIR=/data/bulkhead/audit
# Persistent Ed25519 signing seed (ADR-0008): systemd places it at
# $CREDENTIALS_DIRECTORY/audit-seed, where loadSigningKey reads it for a STABLE audit
# identity across reboots. VM phase: a plaintext on-device seed via LoadCredential (qemu
# vTPM unseal is unreliable, ADR-0001 #12). Bare metal: switch to
#   LoadCredentialEncrypted=audit-seed:/data/bulkhead/audit-seed.cred
# (the seal service in tpm2 mode produces the encrypted .cred). REQUIRE_SEALED_KEY makes a
# missing/garbled seed fail CLOSED instead of signing the chain with an ephemeral key.
LoadCredential=audit-seed:/data/bulkhead/audit-seed
Environment=BULKHEAD_REQUIRE_SEALED_KEY=1
