# Yocto-only drop-in (ADR-0034/0017 production seam): on the read-only-rootfs appliance /var/lib is a
# volatile tmpfs, so the egress proxy's signed egress-decision chain would be wiped every reboot.
# Redirect it to the persistent /data partition (outside the RAUC A/B slots, so it survives atomic
# updates too), mirroring the collector/broker/router. This is a meta-bulkhead (Yocto-only) drop-in;
# the Buildroot prototype neither builds nor runs the egress proxy, so nothing there is affected.
#
# DynamicUser wrinkle (the proxy is NOT User=root): it runs DynamicUser=yes, so its uid DIFFERS each
# boot — a /data dir/file owned by one boot's uid is unwritable by the next. Fix (identical to the
# router): the fixed system group `bulkhead-audit` (baked into /etc/group by the image recipe) owns a
# group-writable, setgid chain dir; the proxy joins it via SupplementaryGroups; and a privileged (`+`)
# ExecStartPre re-groups + group-write-enables the dir and any chain file left by a PRIOR boot's
# (different) uid, so whichever dynamic uid runs THIS boot can append the same persistent chain.
# Integrity is the Ed25519 signature, not the file mode, so root re-permissioning changes access only.
[Unit]
RequiresMountsFor=/data
# Same TPM-sealed seed as the collector/broker/router -> one stable audit identity, domain-separated by
# the "egress-proxy" tag (ADR-0008). The seed must be sealed before the proxy unseals it as a credential.
Requires=bulkhead-seal-audit-key.service
After=bulkhead-seal-audit-key.service

[Service]
# /data is a separate mount; ReadWritePaths opens it under ProtectSystem=strict so both the privileged
# ExecStartPre below and the proxy itself can write the chain dir there.
ReadWritePaths=/data
# Clear the StateDirectory the base unit set (StateDirectory is a LIST directive, so a drop-in must
# assign the empty string to reset it). On Yocto the chain lives on /data; leaving it set would only
# have systemd create a stray, never-written /var/lib/bulkhead/audit-egress on the volatile tmpfs.
StateDirectory=
SupplementaryGroups=bulkhead-audit
# Run as root (`+`, regardless of DynamicUser): create the chain dir root:bulkhead-audit, setgid +
# group-rwx (2770) so files inherit the group, and make BOTH chain files left by a PRIOR boot's
# (different) dynamic uid group-writable so THIS boot's uid can append them. LOAD-BEARING, not cosmetic:
# without it the next boot's uid (group member, not owner) hits EACCES reopening provenance.jsonl
# (O_APPEND) and audit-pub.txt (O_TRUNC, rewritten every start). Failures fail the unit (fail-closed: no
# writable /data chain => no un-persisted egress); a not-yet-created file is skipped (first boot).
ExecStartPre=+/bin/sh -c 'set -e; d=/data/bulkhead/audit-egress; mkdir -p "$d"; chgrp bulkhead-audit "$d"; chmod 2770 "$d"; for f in provenance.jsonl audit-pub.txt; do if [ -f "$d/$f" ]; then chgrp bulkhead-audit "$d/$f"; chmod 0660 "$d/$f"; fi; done'
Environment=BULKHEAD_AUDIT_DIR=/data/bulkhead/audit-egress
# Persistent Ed25519 signing seed (ADR-0008): systemd drops it at $CREDENTIALS_DIRECTORY/audit-seed
# (0400, per-boot uid) where loadSigningKey reads it for a STABLE audit identity across boots. VM phase:
# plaintext on-device seed via LoadCredential. Bare metal: LoadCredentialEncrypted=audit-seed:/data/
# bulkhead/audit-seed.cred. REQUIRE_SEALED_KEY makes a missing/garbled seed fail CLOSED (the proxy
# refuses to start) rather than signing with an ephemeral, unverifiable key.
LoadCredential=audit-seed:/data/bulkhead/audit-seed
Environment=BULKHEAD_REQUIRE_SEALED_KEY=1
