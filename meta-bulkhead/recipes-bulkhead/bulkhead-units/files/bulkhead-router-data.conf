# SPDX-License-Identifier: AGPL-3.0-only
# Yocto-only drop-in (the ADR-0027 production seam): on the read-only-rootfs appliance /var/lib is a
# volatile tmpfs, so the router's signed routing-decision chain (ADR-0027) would be wiped every reboot.
# Redirect it to the persistent /data partition (outside the RAUC A/B slots, so it survives atomic
# updates too), mirroring the collector/broker. NOT in the shared rootfs-overlay, so the Buildroot
# prototype keeps writing /var/lib/bulkhead/audit-router (its 11-audit.conf StateDirectory) unchanged.
# This drop-in sorts AFTER 11-audit.conf, so its BULKHEAD_AUDIT_DIR override is the one that wins.
#
# DynamicUser wrinkle (the router is NOT User=root like the collector/broker): the router runs
# DynamicUser=yes, so its uid DIFFERS each boot — a /data dir/file owned by one boot's uid is unwritable
# by the next. Fix: a fixed system group `bulkhead-audit` (baked into /etc/group by the image recipe —
# read-only-rootfs means no runtime sysusers) owns a group-writable, setgid chain dir; the router joins it
# via SupplementaryGroups; and a privileged (`+`) ExecStartPre re-groups + group-write-enables the dir and
# any chain file left by a PRIOR boot's (different) uid, so whichever dynamic uid runs THIS boot can append
# the same persistent chain. Integrity is the Ed25519 signature, not the file mode, so root re-permissioning
# the files each boot changes access only, not the tamper-evidence.
[Unit]
RequiresMountsFor=/data
# Same TPM-sealed seed as the collector/broker -> one stable audit identity, domain-separated by the
# "router" tag (ADR-0008/0027). The seed must be sealed before the router unseals it as a credential.
Requires=bulkhead-seal-audit-key.service
After=bulkhead-seal-audit-key.service

[Service]
# /data is a separate mount (data.mount); ReadWritePaths opens it under ProtectSystem=strict so both the
# privileged ExecStartPre below and the router itself can write the chain dir there.
ReadWritePaths=/data
# Clear the StateDirectory= the Buildroot 11-audit.conf set (StateDirectory is a LIST directive, so a
# drop-in must assign the empty string to reset it, not just not-mention it). On Yocto the chain lives on
# /data, so leaving it set would only have systemd create a stray, never-written /var/lib/bulkhead/
# audit-router on the volatile tmpfs each boot. The router needs no StateDirectory (it writes /data only).
StateDirectory=
# The router's per-boot DynamicUser joins this fixed group; the dir + files are group-owned and
# group-writable (below) so any boot's uid can append the same persistent chain. The group is created at
# image build (bulkhead-image.bb, inherit extrausers); its name is deliberately distinct from the router's
# DynamicUser name to avoid clashing with systemd's transient per-unit user/group.
SupplementaryGroups=bulkhead-audit
# Run as root (`+`, regardless of DynamicUser): create the chain dir root:bulkhead-audit, setgid + group-rwx
# (2770) so files created in it inherit the group, and make BOTH chain files left by a PRIOR boot's
# (different) dynamic uid group-writable so THIS boot's uid can write them. This re-permissioning is
# LOAD-BEARING, not cosmetic — without it the next boot's uid (only a group member, not the owner) hits
# EACCES: provenance.jsonl is reopened O_APPEND, and audit-pub.txt is reopened O_TRUNC (the router rewrites
# it every start, audit.go), and a prior-boot file is 0600/0644 with no group write. Do NOT drop audit-pub.txt
# from this loop — that reintroduces the cross-boot EACCES. (Its mode then briefly oscillates: root sets 0660,
# the router's WriteFile resets it to 0644; harmless — it's the exported pubkey, world-readable by design, and
# verify-audit trusts the SEALED seed, not this file.) mkdir/chgrp/chmod failures fail the unit (fail-closed:
# no writable /data chain => no un-persisted routing); a not-yet-created file is skipped (first boot).
# ADR-0038: sealed rotation segments (provenance.jsonl.NNNNNN) are immutable but the NEXT boot's dynamic uid
# must still READ the newest one (lastChainTip seeds the cross-boot prevHash from it when the live file is
# empty after a rotate — else it forks at genesis). They are created 0600 by a prior boot's uid, so make
# them group-readable (0640) here; prune only needs dir-write, which the setgid group dir already grants.
ExecStartPre=+/bin/sh -c 'set -e; d=/data/bulkhead/audit-router; mkdir -p "$d"; chgrp bulkhead-audit "$d"; chmod 2770 "$d"; for f in provenance.jsonl audit-pub.txt; do if [ -f "$d/$f" ]; then chgrp bulkhead-audit "$d/$f"; chmod 0660 "$d/$f"; fi; done; for s in "$d"/provenance.jsonl.[0-9]*; do if [ -f "$s" ]; then chgrp bulkhead-audit "$s"; chmod 0640 "$s"; fi; done'
Environment=BULKHEAD_AUDIT_DIR=/data/bulkhead/audit-router
# ADR-0038: bound this chain's /data footprint with signed segment rotation (8 MiB segments, keep 1 =>
# 16 MiB cap) so this tier cannot fill /data and starve the chains into a fail-closed append DoS (R9).
# See bulkhead-collector-data.conf for the 80 MiB < 100 MB per-tier budget.
Environment=BULKHEAD_AUDIT_SEGMENT_BYTES=8388608
Environment=BULKHEAD_AUDIT_SEGMENTS_KEEP=1
# Persistent Ed25519 signing seed (ADR-0008): systemd drops it at $CREDENTIALS_DIRECTORY/audit-seed (0400,
# owned by the per-boot dynamic uid) where loadSigningKey reads it for a STABLE audit identity across boots.
# VM phase: plaintext on-device seed via LoadCredential (qemu vTPM unseal is unreliable, ADR-0001 #12). Bare
# metal: switch to LoadCredentialEncrypted=audit-seed:/data/bulkhead/audit-seed.cred (the seal service in
# tpm2 mode produces the encrypted .cred). REQUIRE_SEALED_KEY makes a missing/garbled seed fail CLOSED (the
# router refuses to start) rather than signing the chain with an ephemeral, unverifiable key.
LoadCredential=audit-seed:/data/bulkhead/audit-seed
Environment=BULKHEAD_REQUIRE_SEALED_KEY=1
