# SPDX-License-Identifier: AGPL-3.0-only
# bulkhead kernel security floor (ported verbatim from the verified v1 Buildroot
# fragment, external/board/bulkhead/linux-bulkhead.fragment). Keep the two in
# sync. Merged into the Yocto kernel .config via the linux-yocto bbappend.

# expose running config for verification
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# BPF core + CO-RE (BTF) + ring buffer
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_BPF_JIT_ALWAYS_ON=y
# BPF-LSM trampoline needs DYNAMIC_FTRACE_WITH_DIRECT_CALLS (FUNCTION_TRACER)
CONFIG_FUNCTION_TRACER=y
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_UPROBE_EVENTS=y
CONFIG_BPF_EVENTS=y
CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y
CONFIG_DEBUG_INFO_BTF=y
CONFIG_DEBUG_INFO_BTF_MODULES=y

# LSM framework: BPF-LSM + Landlock + Yama + lockdown; seccomp (orthogonal)
CONFIG_SECURITY=y
CONFIG_SECURITYFS=y
CONFIG_BPF_LSM=y
CONFIG_SECURITY_LANDLOCK=y
CONFIG_SECURITY_YAMA=y
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_LSM="landlock,lockdown,yama,bpf"

# cgroup v2 + controllers + cgroup-attached BPF (systemd egress firewall)
CONFIG_CGROUPS=y
CONFIG_MEMCG=y
CONFIG_CGROUP_PIDS=y
CONFIG_CPUSETS=y
CONFIG_BLK_CGROUP=y
CONFIG_CGROUP_BPF=y
CONFIG_SOCK_CGROUP_DATA=y

# namespaces (agent jails)
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y

# TPM (measured boot / sealed credentials)
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS=y
CONFIG_HW_RANDOM_TPM=y

# netfilter + nf_tables (default-deny egress floor) + TUN (tailscale)
CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_TUN=y

# dm-verity for the read-only, authenticated rootfs (RAUC verity bundles)
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_SQUASHFS=y
