# SPDX-License-Identifier: AGPL-3.0-only
# bulkhead kernel security floor (ported verbatim from the verified v1 Buildroot
# fragment, external/board/bulkhead/linux-bulkhead.fragment). Keep the two in
# sync. Merged into the Yocto kernel .config via the linux-yocto bbappend.

# expose running config for verification
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# BPF core + CO-RE (BTF) + ring buffer
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_BPF_JIT_ALWAYS_ON=y
# BPF-LSM trampoline needs DYNAMIC_FTRACE_WITH_DIRECT_CALLS (FUNCTION_TRACER)
CONFIG_FUNCTION_TRACER=y
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_UPROBE_EVENTS=y
CONFIG_BPF_EVENTS=y
CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y
CONFIG_DEBUG_INFO_BTF=y
CONFIG_DEBUG_INFO_BTF_MODULES=y

# LSM framework: BPF-LSM + Landlock + Yama + lockdown; seccomp (orthogonal)
CONFIG_SECURITY=y
CONFIG_SECURITYFS=y
# Enables the socket-family LSM hooks (security_socket_connect, ...). Without it the
# kernel has no bpf_lsm_socket_connect, so the collector's BPF-LSM attach can't find
# its target in vmlinux BTF and falls back to a privileged module search (EPERM).
# scarthgap defaults this off; Buildroot's defconfig had it on.
CONFIG_SECURITY_NETWORK=y
CONFIG_BPF_LSM=y
CONFIG_SECURITY_LANDLOCK=y
CONFIG_SECURITY_YAMA=y
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_LSM="landlock,lockdown,yama,bpf"

# ADR-0033: io_uring is a syscall-INVISIBLE I/O channel (submission/completion rings bypass the
# read/write/sendto the collector + jails observe), so every agent jail bans its three syscalls by
# seccomp. Compile it OUT of the kernel as the defense-in-depth FLOOR: a jail with a misconfigured
# filter then still gets ENOSYS, and the Firecracker hostile-tier guest (ADR-0042 — its vmlinux is
# extracted from THIS kernel) has no in-VM io_uring either (closes the IOURING probe gap). Nothing in
# the appliance consumes io_uring (verified: no liburing dependency anywhere in the image).
# IO_URING is `bool "..." if EXPERT default y`, so the disable is INERT without EXPERT (olddefconfig
# keeps the default). EXPERT only unhides prompts; the affected symbols are `default y` unconditionally,
# so values are unchanged (verified by a before/after .config diff) — it just makes IO_URING settable.
CONFIG_EXPERT=y
# CONFIG_IO_URING is not set
# Neutralize EXPERT's side effects so the NET kernel change is io_uring ONLY (verified by a before/after
# .config diff collapsing to {EXPERT, IO_URING, IO_WQ}). EXPERT unhides prompts whose EXPERT-default
# differs: it turns the media subdriver FILTER off (dragging in DVB/tuner/radio modules) and flips a batch
# of HID/input/rfkill drivers + DEBUG_MEMORY_INIT off. Pin each back; re-hiding the media drivers
# (MEDIA_SUPPORT_FILTER) reverts the whole DVB/tuner/radio block in one line.
CONFIG_MEDIA_SUPPORT_FILTER=y
CONFIG_MEDIA_HIDE_ANCILLARY_SUBDRV=y
CONFIG_DEBUG_MEMORY_INIT=y
CONFIG_INPUT_FF_MEMLESS=y
CONFIG_RFKILL_INPUT=y
CONFIG_HID_A4TECH=y
CONFIG_HID_APPLE=y
CONFIG_HID_BELKIN=y
CONFIG_HID_CHERRY=y
CONFIG_HID_CHICONY=y
CONFIG_HID_CYPRESS=y
CONFIG_HID_EZKEY=y
CONFIG_HID_ITE=y
CONFIG_HID_KENSINGTON=y
CONFIG_HID_LOGITECH=y
CONFIG_HID_MICROSOFT=y
CONFIG_HID_MONTEREY=y
CONFIG_HID_REDRAGON=y
# CONFIG_TTY_PRINTK is not set

# cgroup v2 + controllers + cgroup-attached BPF (systemd egress firewall)
CONFIG_CGROUPS=y
CONFIG_MEMCG=y
CONFIG_CGROUP_PIDS=y
CONFIG_CPUSETS=y
CONFIG_BLK_CGROUP=y
CONFIG_CGROUP_BPF=y
CONFIG_SOCK_CGROUP_DATA=y

# namespaces (agent jails)
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y

# TPM (measured boot / sealed credentials). TIS drives the qemu `-device tpm-tis`
# backend; CRB covers the q35/CRB variant. SECURITYFS (present) exposes
# /sys/kernel/security/tpm0/binary_bios_measurements (the measured-boot event log).
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS=y
CONFIG_TCG_CRB=y
CONFIG_HW_RANDOM_TPM=y

# netfilter + nf_tables (default-deny egress floor) + TUN (tailscale)
CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
# ct state matching for the floor (`ct state established,related`). NFT_CT=y is the
# key lever: a =y symbol can't depend on a =m one, so this forces NF_CONNTRACK built
# in — otherwise scarthgap leaves conntrack =m and nft -f fails at boot trying to
# load nft_ct/nf_conntrack modules the image doesn't ship. Matches the v1 floor.
CONFIG_NFT_CT=y
CONFIG_NFT_COUNTER=y
CONFIG_NFT_LOG=y
# The drop-log rule is `limit rate ... log ... counter`, which needs three expressions:
# NFT_LIMIT (the rate limiter), NFT_LOG + NF_LOG_SYSLOG (the log statement + its
# printk/syslog backend -> dmesg/journal), and NFT_COUNTER (above).
CONFIG_NFT_LIMIT=y
CONFIG_NF_LOG_SYSLOG=y
CONFIG_TUN=y

# dm-verity for the read-only, authenticated rootfs (RAUC verity bundles)
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_SQUASHFS=y
