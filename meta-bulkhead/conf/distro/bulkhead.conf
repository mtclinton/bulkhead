require conf/distro/poky.conf

DISTRO = "bulkhead"
DISTRO_NAME = "bulkhead agent appliance"
DISTRO_VERSION = "0.1.0"

# systemd init (matches the v1 prototype); no sysvinit.
INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " systemd rauc seccomp"
DISTRO_FEATURES:remove = "sysvinit"

# scarthgap ships linux-yocto 6.6 LTS; the bulkhead security fragment (BPF-LSM,
# Landlock, FUNCTION_TRACER, BTF, cgroup-v2 …) applies cleanly to it. The
# bootloader gets the same lsm= + net.ifnames line as the v1 prototype.
QB_KERNEL_CMDLINE_APPEND:append = " lsm=landlock,lockdown,yama,bpf net.ifnames=0"

# SBOM (SPDX 3.0) + CVE folded in, for an attestable security appliance.
INHERIT += "create-spdx"

# Reproducible release engineering.
BB_HASHSERVE ?= "auto"
BB_SIGNATURE_HANDLER ?= "OEEquivHash"
