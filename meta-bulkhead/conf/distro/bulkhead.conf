require conf/distro/poky.conf

DISTRO = "bulkhead"
DISTRO_NAME = "bulkhead agent appliance"
DISTRO_VERSION = "0.1.0"

# systemd init (matches the v1 prototype); no sysvinit.
INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " systemd rauc seccomp"
# Drop stray attack surface pulled by core-image's base packagegroups:
# zeroconf->avahi-daemon, 3g->ofono, nfs->rpcbind, plus bluetooth/wifi/nfc the
# appliance never uses (tailscale is the mesh, nftables the floor). Removed at the
# source rather than masked. Keep ipv6/vfat/pci/seccomp/rauc/systemd.
DISTRO_FEATURES:remove = "sysvinit 3g nfs zeroconf bluetooth wifi nfc"

# scarthgap ships linux-yocto 6.6 LTS; the bulkhead security fragment (BPF-LSM,
# Landlock, FUNCTION_TRACER, BTF, cgroup-v2 …) applies cleanly to it. The
# bootloader gets the same lsm= + net.ifnames line as the v1 prototype.
QB_KERNEL_CMDLINE_APPEND:append = " lsm=landlock,lockdown,yama,bpf net.ifnames=0"

# Measured boot + TPM-sealed credentials (ADR-0008). tpm2 in MACHINE_FEATURES makes the
# OVMF build enable the EDK2 Tcg2 protocol (TPM_ENABLE=TRUE) so firmware measures into
# PCRs 0-7; tpm2 in systemd's PACKAGECONFIG pulls tpm2-tss and turns on the systemd-creds
# TPM backend + systemd-pcrphase (PCR 11 boot phases). The audit-log signing key is sealed
# to PCR 7 (Secure Boot state) — stable across RAUC A/B updates — and delivered via
# LoadCredentialEncrypted; see ADR-0008.
MACHINE_FEATURES:append = " tpm2"
# tpm2 enables the TPM backend; openssl is what actually compiles systemd-creds'
# encrypted-credential support (the AES backing) — WITHOUT it systemd-creds reports
# "Support for encrypted credentials not available" and no sealing works at all.
PACKAGECONFIG:append:pn-systemd = " tpm2 openssl"

# SBOM (SPDX 3.0) + CVE folded in, for an attestable security appliance.
INHERIT += "create-spdx"

# Reproducible release engineering.
BB_HASHSERVE ?= "auto"
BB_SIGNATURE_HANDLER ?= "OEEquivHash"
