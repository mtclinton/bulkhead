# bulkhead DNS-driven egress allowlist resolver: a localhost-only caching forwarder on
# 127.0.0.1:5353 (systemd-resolved keeps 127.0.0.53:53 as the stub and forwards here).
# Each A/AAAA for api.anthropic.com — including the CDN CNAME-chain edge IPs — is added
# to the inet/bulkhead nft sets that gate the default-deny output chain. Runs as the
# default 'nobody' user; with nftset, dnsmasq retains CAP_NET_ADMIN to write the sets.

listen-address=127.0.0.1
port=5353
bind-interfaces

# Forward ONLY to these pinned upstreams; never read /etc/resolv.conf (no loop with
# systemd-resolved). These MUST match dns_upstream_v4/v6 in /etc/nftables.conf.
no-resolv
server=1.1.1.1
server=9.9.9.9

# Populate the nft sets. 4# = A records -> v4 set; 6# = AAAA -> v6 set (an nft set holds
# one address family). dnsmasq adds the terminal CDN edge IPs synchronously as it
# answers, so the IP is in the set by the time the client connects.
nftset=/api.anthropic.com/4#inet#bulkhead#anthropic_v4
nftset=/api.anthropic.com/6#inet#bulkhead#anthropic_v6

# Hygiene for a localhost-only resolver.
no-hosts
domain-needed
bogus-priv
cache-size=10000
# Floor tiny CDN TTLs so an active client's re-resolution refreshes the set element
# well before the 1h nft timeout (avoids a spurious deny between lookups).
min-cache-ttl=120
