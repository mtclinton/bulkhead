# bulkhead drop-in over the OE dnsmasq.service.
[Unit]
# The nft sets must exist (created empty by the firewall) before dnsmasq `add element`s.
After=bulkhead-firewall.service
Requires=bulkhead-firewall.service
# Be the resolver before the agents that resolve api.anthropic.com.
Before=bulkhead-router.service llama-server.service
# dnsmasq must NOT gate bulkhead-selftest: the self-test probes the floor with the sets
# EMPTY (fail-closed), which is correct.

[Service]
# Pre-warm the allowlist so the first agent dial doesn't race a cold set (the kernel
# set commit can lag dnsmasq's reply). '-' so a transient failure doesn't fail the unit.
ExecStartPost=-/bin/sh -c 'for h in api.anthropic.com api.openai.com generativelanguage.googleapis.com; do for i in 1 2 3 4 5 6; do nslookup "$h" 127.0.0.53 && break; sleep 1; done; done'
