# SPDX-License-Identifier: AGPL-3.0-only
# Go CI: build + vet + test (incl. -race) for both Go modules. This is the missing
# enforcement behind ADR-0027's "a golden vector is pinned in BOTH modules ... so CI fails
# on any drift": each module's `go test` runs its pinned canonical() golden vector, so a
# cross-module audit-record encoding drift (or any unit-test regression) fails HERE, before
# it ships, instead of resting on a local-only convention. No network: the collector vendors
# its deps, the router is stdlib-only.
name: go
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [collector, router, agent, chain-monitor]
    defaults:
      run:
        working-directory: src/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # Nothing to cache: collector deps are vendored, router is stdlib-only.
          cache: false
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: test -race
        run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: '1'
  floor-lint:
    name: security-floor-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Static guard (no qemu/hardware) over the shipped units + kernel fragments for the load-bearing
      # seccomp/hardening invariants the ADRs require; carries its own negative self-test.
      - name: floor-lint
        run: sh scripts/floor-lint.sh --selftest
