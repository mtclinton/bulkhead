#!/usr/sbin/nft -f
# SPDX-License-Identifier: AGPL-3.0-only
#
# bulkhead default-deny network floor. Egress is denied except: loopback,
# established/related, DNS to PINNED upstreams, DHCP/NTP, the tailnet, and
# destinations dnsmasq resolved for an allowlisted name (the Anthropic API).
#
# The anthropic_v4/v6 sets are EMPTY at boot and populated at RUNTIME by dnsmasq's
# nftset= as it resolves api.anthropic.com (see /etc/dnsmasq.conf). The set-level
# `timeout` expires stale CDN IPs; in-flight TLS survives via `ct established`. This is
# fail-closed: if dnsmasq dies the sets freeze, elements expire, and egress to
# Anthropic stops (no resolution -> no new elements). Trust note: the allowlist is only
# as good as the pinned upstream DNS answers (pin upstreams; consider DNSSEC).
# Tailscale stays on the STATIC tailscale_v4 control CIDRs — tailscaled caches DNS
# internally and uses hardcoded bootstrap IPs, so it can't be driven from dnsmasq.
flush ruleset

table inet bulkhead {
    # Runtime-populated by dnsmasq (nftset=) from api.anthropic.com A/AAAA records.
    set anthropic_v4 { type ipv4_addr; flags timeout; timeout 1h; }
    set anthropic_v6 { type ipv6_addr; flags timeout; timeout 1h; }

    # Pinned DNS upstreams dnsmasq forwards to (MUST match server= in dnsmasq.conf).
    set dns_upstream_v4 { type ipv4_addr; elements = { 1.1.1.1, 9.9.9.9 } }
    set dns_upstream_v6 { type ipv6_addr; elements = { 2606:4700:4700::1111, 2620:fe::9 } }

    set tailscale_v4 {
        type ipv4_addr
        flags interval
        # Tailscale control plane (login/controlplane.tailscale.com). Kept STATIC:
        # tailscaled bypasses our resolver, so a DNS-driven set would blackhole control.
        elements = { 192.200.0.0/24, 199.165.136.0/24 }
    }

    chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        iifname "tailscale0" accept
        udp dport 68 accept                 # DHCP client
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
    }

    chain output {
        type filter hook output priority 0; policy drop;
        oif lo accept                       # agents -> local resolver (loopback)
        ct state established,related accept
        ct state invalid drop

        # DNS ONLY to the pinned upstreams (the resolver's forwarders). This replaces
        # the old blanket `udp dport 53 accept`: direct DNS to arbitrary servers is now
        # denied, so only dnsmasq-resolved IPs can ever enter the allowlist sets.
        ip  daddr @dns_upstream_v4 udp dport 53 accept
        ip  daddr @dns_upstream_v4 tcp dport 53 accept
        ip6 daddr @dns_upstream_v6 udp dport 53 accept
        ip6 daddr @dns_upstream_v6 tcp dport 53 accept

        udp dport { 67, 123 } accept        # DHCP, NTP
        udp dport 41641 accept              # tailscale WireGuard
        oifname "tailscale0" accept         # tailnet traffic
        udp dport 3478 accept               # STUN (NAT traversal)

        # Destinations dnsmasq resolved for api.anthropic.com (runtime-populated).
        ip  daddr @anthropic_v4 tcp dport 443 accept
        ip6 daddr @anthropic_v6 tcp dport 443 accept
        ip  daddr @tailscale_v4 tcp dport { 80, 443 } accept   # Tailscale control (static)

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # (Drop-logging via `log` needs CONFIG_NF_LOG_SYSLOG in the kernel; deferred to a
        # kernel-fragment follow-up so the floor loads on the current kernel. Drops fall
        # through to the chain's `policy drop`.)
    }
}
