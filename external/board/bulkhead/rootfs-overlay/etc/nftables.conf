#!/usr/sbin/nft -f
# SPDX-License-Identifier: AGPL-3.0-only
#
# bulkhead default-deny network floor. Egress is denied except: loopback,
# established/related, DNS/DHCP/NTP, the tailnet, and the Anthropic API range.
#
# v1 prototype uses a STATIC Anthropic CIDR. The production build replaces the
# anthropic_v4 set with a dnsmasq-populated dynamic interval set (api.anthropic.com
# resolves into the set), since CDN-backed endpoints can re-IP. See docs.
flush ruleset

table inet bulkhead {
    set anthropic_v4 {
        type ipv4_addr
        flags interval
        elements = { 160.79.104.0/21 }   # Anthropic-owned (AS399358); verify before shipping
    }

    set tailscale_v4 {
        type ipv4_addr
        flags interval
        # Tailscale control plane + log (login/controlplane.tailscale.com). DERP
        # relays live on many dynamic IPs; production resolves them into this set
        # via dnsmasq, so in qemu the node authenticates/joins via control but
        # relays through DERP only on a deployment with the dynamic allowlist.
        elements = { 192.200.0.0/24, 199.165.136.0/24 }
    }

    chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        iifname "tailscale0" accept
        udp dport 68 accept                 # DHCP client
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
    }

    chain output {
        type filter hook output priority 0; policy drop;
        oif lo accept
        ct state established,related accept
        udp dport { 53, 67, 123 } accept    # DNS, DHCP, NTP
        udp dport 41641 accept              # tailscale WireGuard
        oifname "tailscale0" accept         # tailnet traffic
        ip daddr @anthropic_v4 tcp dport 443 accept   # Anthropic API
        ip daddr @tailscale_v4 tcp dport { 80, 443 } accept   # Tailscale control plane
        udp dport 3478 accept                          # STUN (NAT traversal)
        ip protocol icmp accept
    }
}
