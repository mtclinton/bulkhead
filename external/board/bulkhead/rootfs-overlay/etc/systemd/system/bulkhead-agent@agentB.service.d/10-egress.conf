# Demo agent B: loopback + local IPC only, NO public egress (this is also the template
# default, set explicitly here for the A-vs-B demo). When E2 is armed, B's connect() to
# a public destination is denied (-EPERM) even though the nftables floor would allow it.
[Service]
Environment=BULKHEAD_AGENT_EGRESS=loopback,other
