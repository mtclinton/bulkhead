# Demo agent (ADR-0009): starts with loopback+other only (NO public), then requests an
# egress EXPANSION to public — which the broker grants only on operator approval. Proves
# operator-approved widening: the same cgroup's public class flips denied->allowed. Remove
# with the other demo instances when the real agent runtime lands.
[Service]
Environment=BULKHEAD_AGENT_EGRESS=loopback,other
Environment=BULKHEAD_AGENT_EXPAND=public
