# Demo agent (ADR-0010): starts with loopback+public, then LOOPS probing both so an operator
# can `bulkhead-collector narrow narrowee public` mid-flight and observe the SAME cgroup's
# public class flip allowed->denied IN PLACE — the agent keeps running (incident throttle,
# not a kill). The dual of @expander. Remove with the other demo instances when the real
# agent runtime lands.
[Service]
Environment=BULKHEAD_AGENT_EGRESS=loopback,public
Environment=BULKHEAD_AGENT_NARROW_PROBE=1
