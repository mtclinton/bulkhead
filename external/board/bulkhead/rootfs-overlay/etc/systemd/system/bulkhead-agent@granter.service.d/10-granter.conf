# Demo agent (ADR-0011): with E1 ptrace ARMED, this DynamicUser agent's attempt to ptrace its
# own child is DENIED; it asks the broker for a one-shot grant, the operator approves, and its
# NEXT ptrace succeeds exactly ONCE (the one after is denied again). Proves the kernel-enforced
# single-use E1/E3 exception end-to-end (broker grant write + BPF CAS consume).
#
# ptrace is chosen as the demo op precisely because it needs NO capabilities and the agent
# stays NON-ROOT (DynamicUser) — so it unambiguously cannot self-approve (approve.sock is
# 0600 root) — while still reaching the E1 LSM hook. The standard jail's @system-service
# seccomp omits ptrace, so the drop-in adds it (merged into the allowlist) — otherwise the
# syscall would be EPERM'd by seccomp BEFORE the E1 hook ever runs. Manifest loopback,other so
# the broker IPC (AF_UNIX) isn't E2-denied. Remove with the other demos when the real runtime
# lands.
[Service]
Environment=BULKHEAD_AGENT_EGRESS=loopback,other
Environment=BULKHEAD_AGENT_GRANT=ptrace
SystemCallFilter=ptrace
