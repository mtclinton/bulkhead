# Delegation demo parent Q: manifest = public,loopback,other. When Q delegates a child
# requesting public, the intersection keeps public -> the child legitimately reaches the
# public internet. Contrast with parentP (which lacks public and cannot grant it).
[Service]
Environment=BULKHEAD_AGENT_EGRESS=public,loopback,other
# Double-quoted (value has a space): see parentP for why.
Environment="BULKHEAD_AGENT_DELEGATE=worker public,loopback,other"
