# Demo agent (ADR-0012): requests a one-shot grant and HOLDS it (stays alive without consuming),
# with its grant-clear ExecStopPost DISABLED (the `ExecStopPost=` reset drops the inherited
# clears). So when it stops, the unconsumed grant_once entry STRANDS — exactly as it would when
# E0 is armed (the agent's own clear bpf() is EPERM'd) or when the agent crashes (ExecStopPost
# skipped). This lets the harness prove the TCB-context collector GC reclaims a dead agent's
# stranded grant. Remove with the other demos when the real agent runtime lands.
[Service]
Environment=BULKHEAD_AGENT_EGRESS=loopback,other
Environment=BULKHEAD_AGENT_GRANT_HOLD=ptrace
ExecStopPost=
