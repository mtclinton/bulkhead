# Bind the router to the tailnet address once the node has joined. The
# bind-helper writes BULKHEAD_LISTEN; this EnvironmentFile (processed after the
# base unit's Environment=) overrides the loopback default.
[Unit]
After=bulkhead-router-bind.service
Wants=bulkhead-router-bind.service

[Service]
EnvironmentFile=-/run/bulkhead-router.env
