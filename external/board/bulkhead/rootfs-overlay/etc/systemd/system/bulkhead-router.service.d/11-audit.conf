# ADR-0027: the router's signed routing-decision audit chain. The router runs DynamicUser=yes under
# ProtectSystem=strict, so StateDirectory= is how it gets a persistent, correctly-owned, writable dir:
# systemd creates /var/lib/bulkhead/audit-router owned by the per-boot dynamic uid and adds it to
# ReadWritePaths. The router writes its chain (provenance.jsonl + audit-pub.txt) there; the collector's
# verify-audit checks it with domain="router". On the Yocto appliance a data drop-in redirects
# BULKHEAD_AUDIT_DIR to /data for cross-boot persistence + the TPM-sealed audit-seed (production path).
[Service]
StateDirectory=bulkhead/audit-router
Environment=BULKHEAD_AUDIT_DIR=/var/lib/bulkhead/audit-router
