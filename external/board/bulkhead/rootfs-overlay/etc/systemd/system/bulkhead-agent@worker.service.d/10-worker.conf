# Demo agent (ADR-0014): the REAL agent runtime (bulkhead-agent) — a bounded perceive->decide->
# act loop — running the headline thesis demo. Its task makes it fetch a PUBLIC host, which its
# manifest (loopback,other; NO public) gets E2-DENIED; it then asks the operator (broker EXPAND)
# to widen egress. On approve the retried fetch succeeds; on deny it cannot proceed. Manifest is
# loopback,other so the fetch is genuinely E2-gated, the broker IPC (AF_UNIX = other) is reachable,
# and the router/mock (loopback) is reachable. For the cheap 256MB/no-LLM qemu arm, BULKHEAD_ROUTER_URL
# points at the bundled mockchat. This OVERRIDES the template's stub ExecStart with the real binary
# (reset-then-set) so the existing shell-stub demos (@agentA/@expander/@granter/...) are untouched.
[Service]
Environment=BULKHEAD_AGENT_EGRESS=loopback,other
Environment=BULKHEAD_AGENT_TASK=Fetch https://api.anthropic.com/ and report the HTTP result; if egress is denied, request public egress then retry.
Environment=BULKHEAD_ROUTER_URL=http://127.0.0.1:8088
Environment=BULKHEAD_EXPAND_TIMEOUT=30
Environment=BULKHEAD_AGENT_DEADLINE=120
ExecStart=
ExecStart=/usr/bin/bulkhead-agent %i
