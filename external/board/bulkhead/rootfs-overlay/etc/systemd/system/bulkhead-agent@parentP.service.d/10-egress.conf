# Delegation demo parent P: manifest = loopback,other (NO public). When P delegates a
# child REQUESTING public, the broker intersects -> the child does NOT get public (a
# parent cannot grant egress it lacks). Proves narrow-never-widen. Remove with the other
# demo instances when the real agent runtime lands.
[Service]
Environment=BULKHEAD_AGENT_EGRESS=loopback,other
# Double-quoted: the value contains a space (suffix + classes); systemd would otherwise
# split it into two assignments. The script's unquoted ${VAR} re-splits it into 2 args.
Environment="BULKHEAD_AGENT_DELEGATE=worker public,loopback,other"
