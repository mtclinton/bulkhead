# ADR-0031: workload-class -> isolation-TIER selection policy (PRODUCTION-READINESS [81]).
# bulkhead-agent-tier-launch reads this to decide which jail a named workload class runs in.
#
# Tiers, weakest -> strongest:
#   confined      shared-kernel netns + seccomp jail   (bulkhead-agent-confined@)
#   runsc         gVisor Sentry, host-surface collapse (bulkhead-agent-runsc@)
#   firecracker   KVM microVM, separate guest kernel   (bulkhead-agent-firecracker@)
#
# FAIL-CLOSED rules enforced by the resolver (NOT just convention):
#   - an UNMAPPED class gets `default`;
#   - `default` is sanitized to never be weaker than `runsc`, so an unknown/unvetted workload can never
#     land in the weakest shared-kernel tier (even if this file says `default = confined`);
#   - `firecracker` degrades to `runsc` when /dev/kvm is absent (the strongest AVAILABLE, never below runsc);
#   - an EXPLICIT class -> confined mapping IS honored (an operator opt-in for a vetted, low-risk class).
#
# Format: `class = tier` (last line wins; `#` comments; whitespace ignored).

# Unknown / unspecified workloads: strong, universal default (gVisor; works without KVM).
default = runsc

# The most dangerous workloads: the hardware-virtualized microVM (degrades to runsc without KVM).
hostile = firecracker
untrusted = runsc

# Vetted, low-risk internal workloads an operator has explicitly accepted in the lighter tier.
internal = confined
