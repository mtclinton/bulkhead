# bulkhead egress-proxy allowlist (ADR-0034). One pattern per line:
#   *             allow all names (internal loopback/private/link-local/metadata are STILL
#                 denied at dial — see the proxy's IP-class deny)
#   api.host.com  exact host
#   .example.com  example.com and any subdomain
#   10.0.0.0/8    CIDR (matched when the request is an IP literal)
#   1.2.3.4       exact IP literal
# '#' starts a comment. An EMPTY or MISSING list is fail-closed (deny all).
#
# Shipped default: empty => deny all, until an operator adds the destinations a confined
# agent is permitted to reach. (The bulkhead-agent@ E2-gated agents are unaffected by this
# file; it governs only bulkhead-agent-confined@ via the egress proxy.) The live
# egress-proxy test rewrites this file and opts 127.0.0.0/8 in on the proxy unit.
